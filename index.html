<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 fill=%27%23051C2C%27/%3E%3Cpath d=%27M14 36h9l5-13 8 24 6-17 4 6h4%27 stroke=%27%232251FF%27 stroke-width=%274%27 fill=%27none%27 stroke-linecap=%27square%27/%3E%3C/svg%3E">
<title>大衛健康簡報 2021–2026</title>
<meta name="description" content="大衛個人健康簡報（需登入）。">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{
  --navy:#051C2C;        /* McKinsey deep navy */
  --navy-2:#0B2E45;
  --blue:#2251FF;        /* electric blue — single accent */
  --cyan:#00A9F4;
  --blue-soft:#EEF2FF;
  --ink:#051C2C;
  --body:#2B3A45;
  --muted:#5E6E7A;
  --rule:#D0D7DD;
  --rule-soft:#E8ECEF;
  --paper:#FFFFFF;
  --tint:#F5F7F8;
  /* status — reserved, always paired with a text label */
  --good:#1F7A4D;  --good-bg:#E6F2EC;
  --warn:#A86B00;  --warn-bg:#FBF1DC;
  --bad:#B4232C;   --bad-bg:#F9E3E4;
  --na:#8A979F;    --na-bg:#F0F2F4;
  --serif:"Noto Serif TC","Songti TC",Georgia,serif;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth; scroll-padding-top:64px}
body{font-family:var(--sans); background:var(--paper); color:var(--body); line-height:1.65; font-size:16px; -webkit-font-smoothing:antialiased}
a{color:var(--blue)}
.wrap{max-width:1180px; margin:0 auto; padding:0 32px}
@media(max-width:640px){.wrap{padding:0 16px}}

/* ---------- top nav ---------- */
.nav{position:sticky; top:0; z-index:40; background:#fff; border-bottom:1px solid var(--rule)}
.nav .wrap{display:flex; align-items:center; gap:24px; height:56px}
.nav .brand{font-family:var(--serif); font-weight:900; color:var(--navy); text-decoration:none; white-space:nowrap; font-size:1rem}
.nav .brand span{color:var(--blue)}
.nav ul{list-style:none; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0}
.nav ul::-webkit-scrollbar{display:none}
.nav li a{display:block; padding:17px 10px 15px; font-size:.82rem; font-weight:500; color:var(--muted); text-decoration:none; white-space:nowrap; border-bottom:3px solid transparent}
.nav li a:hover{color:var(--navy)}
.nav li a.active{color:var(--navy); border-bottom-color:var(--blue); font-weight:700}
.nav .print{font-size:.78rem; color:var(--navy); background:none; border:1px solid var(--navy); padding:5px 12px; cursor:pointer; white-space:nowrap; font-family:inherit}
@media(max-width:860px){.nav .print{display:none}}

/* ---------- cover ---------- */
.cover{background:var(--navy); color:#fff; padding:88px 0 72px; position:relative; overflow:hidden}
.cover::after{content:""; position:absolute; right:-120px; top:-60px; width:520px; height:520px; border:1px solid rgba(255,255,255,.08); border-radius:50%}
.cover .kicker{font-size:.8rem; letter-spacing:.18em; color:#9FB3C2; font-weight:700}
.cover h1{font-family:var(--serif); font-weight:900; font-size:clamp(2rem,4.6vw,3.4rem); line-height:1.22; margin:18px 0 20px; max-width:16em}
.cover h1 em{font-style:normal; color:#7EA0FF}
.cover .lede{font-size:1.08rem; color:#D5DEE5; max-width:46em; line-height:1.75}
.cover .meta{display:grid; grid-template-columns:repeat(4,auto); justify-content:start; gap:12px 48px; margin-top:44px; padding-top:22px; border-top:1px solid rgba(255,255,255,.18); font-size:.84rem}
.cover .meta dt{color:#8EA3B3; font-size:.72rem; letter-spacing:.1em; margin-bottom:3px}
.cover .meta dd{color:#fff; font-weight:500}
@media(max-width:760px){.cover{padding:56px 0 48px}.cover .meta{grid-template-columns:1fr 1fr; gap:14px 24px}}

/* ---------- sections ---------- */
section.sec{padding:72px 0 40px; border-bottom:1px solid var(--rule-soft)}
.sec-no{font-size:.78rem; font-weight:700; letter-spacing:.16em; color:var(--blue); margin-bottom:10px}
.sec h2{font-family:var(--serif); color:var(--ink); font-weight:900; font-size:clamp(1.45rem,2.7vw,2.1rem); line-height:1.35; max-width:30em}
.sec .deck{margin-top:14px; font-size:1.02rem; color:var(--muted); max-width:52em}
.sec-body{margin-top:36px}

/* exhibit */
.exhibit{margin-top:40px}
.exhibit-head{border-top:2px solid var(--navy); padding-top:12px; margin-bottom:18px}
.exhibit-no{font-size:.74rem; font-weight:700; letter-spacing:.14em; color:var(--muted)}
.exhibit-title{font-family:var(--serif); font-weight:700; font-size:1.18rem; color:var(--ink); margin-top:4px; line-height:1.45}
.exhibit-sub{font-size:.86rem; color:var(--muted); margin-top:2px}
.source{margin-top:14px; font-size:.74rem; color:var(--muted); line-height:1.6}
.source b{color:var(--body)}

/* exec summary */
.exec{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0; border-top:1px solid var(--rule)}
.exec .pt{padding:26px 26px 26px 0; border-right:1px solid var(--rule)}
.exec .pt + .pt{padding-left:26px}
.exec .pt:last-child{border-right:none}
.exec .num{font-family:var(--serif); font-size:2.6rem; font-weight:900; color:var(--blue); line-height:1}
.exec h3{font-family:var(--serif); font-size:1.12rem; font-weight:700; color:var(--ink); margin:12px 0 8px; line-height:1.45}
.exec p{font-size:.92rem}
@media(max-width:860px){.exec{grid-template-columns:1fr}.exec .pt,.exec .pt + .pt{padding:22px 0; border-right:none; border-bottom:1px solid var(--rule)}}

.bottomline{margin-top:36px; background:var(--tint); border-left:4px solid var(--blue); padding:22px 26px}
.bottomline .lbl{font-size:.74rem; font-weight:700; letter-spacing:.14em; color:var(--blue); margin-bottom:6px}
.bottomline p{font-family:var(--serif); font-size:1.12rem; color:var(--ink); font-weight:700; line-height:1.7}

.kpis{display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); margin-top:36px}
.kpi{padding:18px 16px; border-right:1px solid var(--rule-soft)}
.kpi:last-child{border-right:none}
.kpi .v{font-family:var(--serif); font-weight:900; font-size:2rem; color:var(--ink); line-height:1.1}
.kpi .v small{font-size:.9rem; font-weight:700; margin-left:2px}
.kpi .l{font-size:.8rem; color:var(--muted); margin-top:6px; line-height:1.45}
@media(max-width:960px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(3){border-right:none}.kpi:nth-child(-n+3){border-bottom:1px solid var(--rule-soft)}}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-right:1px solid var(--rule-soft)!important;border-bottom:1px solid var(--rule-soft)}.kpi:nth-child(2n){border-right:none!important}}

/* team */
.team{display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--rule)}
.member{padding:18px 20px 18px 0; border-bottom:1px solid var(--rule-soft)}
.member .role{font-size:.72rem; font-weight:700; letter-spacing:.1em; color:var(--blue)}
.member .name{font-family:var(--serif); font-weight:700; color:var(--ink); margin:2px 0 4px}
.member p{font-size:.86rem; color:var(--muted)}
@media(max-width:860px){.team{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.team{grid-template-columns:1fr}}

/* timeline */
.timeline{display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--rule)}
.yr{padding:18px 14px 20px; border-right:1px solid var(--rule-soft); position:relative}
.yr:last-child{border-right:none; background:var(--blue-soft)}
.yr .y{font-family:var(--serif); font-size:1.6rem; font-weight:900; color:var(--ink)}
.yr .inst{font-size:.74rem; color:var(--muted); margin-bottom:10px}
.yr .tag{display:inline-block; font-size:.72rem; font-weight:700; padding:2px 8px; margin-bottom:10px}
.yr h4{font-size:.92rem; font-weight:700; color:var(--ink); line-height:1.45; margin-bottom:8px}
.yr ul{list-style:none; font-size:.8rem; color:var(--body)}
.yr li{padding-left:14px; position:relative; margin-bottom:4px; line-height:1.5}
.yr li::before{content:"+"; position:absolute; left:0; font-weight:700; color:var(--good)}
.yr li.neg::before{content:"−"; color:var(--bad)}
@media(max-width:1000px){.timeline{grid-template-columns:repeat(3,1fr)}.yr:nth-child(3){border-right:none}.yr:nth-child(-n+3){border-bottom:1px solid var(--rule-soft)}}
@media(max-width:560px){.timeline{grid-template-columns:1fr}.yr{border-right:none;border-bottom:1px solid var(--rule-soft)}}

/* status chips */
.st{display:inline-flex; align-items:center; gap:5px; font-size:.74rem; font-weight:700; padding:2px 8px; white-space:nowrap}
.st::before{font-size:.8em}
.st.good{color:var(--good); background:var(--good-bg)} .st.good::before{content:"●"}
.st.warn{color:var(--warn); background:var(--warn-bg)} .st.warn::before{content:"▲"}
.st.bad{color:var(--bad); background:var(--bad-bg)}    .st.bad::before{content:"■"}
.st.na{color:var(--na); background:var(--na-bg)}       .st.na::before{content:"○"}
.st.closed{color:var(--navy); background:var(--rule-soft)} .st.closed::before{content:"✓"}

/* heatmap */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; font-size:.86rem}
th,td{text-align:left; padding:9px 10px; border-bottom:1px solid var(--rule-soft); vertical-align:top}
thead th{font-size:.74rem; font-weight:700; letter-spacing:.06em; color:var(--muted); border-bottom:2px solid var(--navy); white-space:nowrap}
tbody th{font-weight:700; color:var(--ink); white-space:nowrap}
.heat td{text-align:center; padding:6px 4px; vertical-align:middle}
.heat td .st{width:100%; justify-content:center; padding:5px 4px}
.heat td.trend{text-align:left; font-size:.8rem; color:var(--body); min-width:220px}
.heat thead th.y26{color:var(--blue)}
.legend{display:flex; flex-wrap:wrap; gap:8px 18px; margin-bottom:14px; font-size:.8rem; color:var(--muted)}
.legend span{display:flex; align-items:center; gap:6px}

/* strengths */
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:40px}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:28px}
@media(max-width:860px){.grid2,.grid3{grid-template-columns:1fr; gap:24px}}
.pillar{border-top:3px solid var(--navy); padding-top:14px}
.pillar .k{font-size:.72rem; letter-spacing:.12em; font-weight:700; color:var(--blue)}
.pillar h3{font-family:var(--serif); font-size:1.1rem; color:var(--ink); margin:4px 0 10px; line-height:1.45}
.pillar .big{font-family:var(--serif); font-weight:900; font-size:2.2rem; color:var(--navy); line-height:1.1}
.pillar .big small{font-size:.95rem; font-weight:700; color:var(--muted); margin-left:4px}
.pillar ul{list-style:none; margin-top:10px; font-size:.88rem}
.pillar li{padding:6px 0; border-bottom:1px solid var(--rule-soft)}
.pillar .md{margin-top:12px; font-size:.82rem; color:var(--muted); border-left:2px solid var(--rule); padding-left:10px}

.bs{display:grid; grid-template-columns:1fr 1fr; border:1px solid var(--rule)}
.bs > div{padding:22px 24px}
.bs > div:first-child{border-right:1px solid var(--rule)}
.bs h3{font-family:var(--serif); font-size:1.05rem; color:var(--ink); padding-bottom:10px; border-bottom:2px solid var(--navy); margin-bottom:6px; display:flex; justify-content:space-between; align-items:baseline}
.bs h3 small{font-family:var(--sans); font-size:.76rem; color:var(--muted); font-weight:500}
.bs ol{list-style:none; counter-reset:i}
.bs li{counter-increment:i; padding:10px 0 10px 30px; border-bottom:1px solid var(--rule-soft); position:relative; font-size:.9rem}
.bs li::before{content:counter(i); position:absolute; left:0; top:10px; font-family:var(--serif); font-weight:900; color:var(--blue)}
.bs .liab li::before{color:var(--bad)}
.bs li b{color:var(--ink)}
@media(max-width:760px){.bs{grid-template-columns:1fr}.bs > div:first-child{border-right:none;border-bottom:1px solid var(--rule)}}

/* issue tree */
.tree{display:grid; grid-template-columns:1fr 28px 1.1fr 28px 1fr 28px 1.2fr; align-items:center}
.tree .col{display:flex; flex-direction:column; gap:10px}
.node{border:1px solid var(--rule); padding:12px 14px; background:#fff}
.node .t{font-size:.7rem; font-weight:700; letter-spacing:.1em; color:var(--muted)}
.node .h{font-weight:700; color:var(--ink); font-size:.95rem; line-height:1.4; margin-top:2px}
.node .d{font-size:.8rem; color:var(--muted); margin-top:3px}
.node.root{background:var(--navy); border-color:var(--navy)}
.node.root .t{color:#9FB3C2} .node.root .h{color:#fff; font-size:1.05rem} .node.root .d{color:#C9D5DE}
.node.core{border:2px solid var(--blue)}
.node.core .h{font-size:1.05rem}
.node.out .h{display:flex; justify-content:space-between; gap:8px}
.node.sep{border-style:dashed; background:var(--tint)}
.arrow{text-align:center; color:var(--blue); font-weight:900; font-size:1.2rem}
@media(max-width:960px){.tree{grid-template-columns:1fr}.arrow{transform:rotate(90deg); padding:4px 0}}

/* charts */
.charts{display:grid; grid-template-columns:repeat(3,1fr); gap:28px 32px}
@media(max-width:960px){.charts{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.charts{grid-template-columns:1fr}}
.chart-card .ct{font-weight:700; color:var(--ink); font-size:.95rem}
.chart-card .cs{font-size:.78rem; color:var(--muted); margin-bottom:6px}
.chart-card .cs .rk{margin-left:10px; padding-left:20px; position:relative}
.chart-card .cs .rk::before{content:""; position:absolute; left:0; top:50%; width:14px; border-top:1.5px dashed #8A979F}
.chart-card .box{position:relative; height:210px}
.chart-card .so{font-size:.82rem; color:var(--body); margin-top:8px; border-top:1px solid var(--rule-soft); padding-top:8px}
.chart-card .so b{color:var(--ink)}

/* priority matrix */
.matrix-wrap{display:grid; grid-template-columns:1.05fr 1fr; gap:40px; align-items:start}
@media(max-width:960px){.matrix-wrap{grid-template-columns:1fr}}
.matrix{position:relative; aspect-ratio:1/0.82; border-left:2px solid var(--navy); border-bottom:2px solid var(--navy); margin:0 0 34px 34px}
.matrix .q{position:absolute; width:50%; height:50%; padding:10px; font-size:.72rem; font-weight:700; letter-spacing:.06em; color:var(--muted)}
.matrix .q1{right:0; top:0; background:var(--blue-soft); color:var(--blue)}
.matrix .q2{left:0; top:0; border-right:1px dashed var(--rule)}
.matrix .q3{left:0; bottom:0; border-right:1px dashed var(--rule); border-top:1px dashed var(--rule)}
.matrix .q4{right:0; bottom:0; border-top:1px dashed var(--rule)}
.matrix .ax{position:absolute; font-size:.74rem; color:var(--muted); font-weight:700}
.matrix .ax.x{bottom:-28px; left:0; right:0; text-align:center}
.matrix .ax.y{left:-30px; top:0; bottom:0; writing-mode:vertical-rl; text-align:center; letter-spacing:.2em}
.dot{position:absolute; transform:translate(-50%,50%); width:30px; height:30px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.78rem; font-weight:700; color:#fff; background:var(--navy); border:2px solid #fff; cursor:default}
.dot.t1{background:var(--bad)} .dot.t2{background:var(--warn)} .dot.t3{background:var(--muted)}
.dot:hover::after{content:attr(data-tip); position:absolute; bottom:36px; left:50%; transform:translateX(-50%); background:var(--navy); color:#fff; font-size:.74rem; font-weight:500; padding:6px 9px; white-space:nowrap; z-index:5}
.mlist{list-style:none; font-size:.86rem}
.mlist li{display:grid; grid-template-columns:28px 1fr auto; gap:10px; padding:8px 0; border-bottom:1px solid var(--rule-soft); align-items:baseline}
.mlist .n{font-family:var(--serif); font-weight:900; color:var(--ink)}

/* action table */
.tier{margin-top:36px}
.tier-h{display:flex; align-items:baseline; gap:14px; border-bottom:2px solid var(--navy); padding-bottom:8px}
.tier-h h3{font-family:var(--serif); font-size:1.15rem; color:var(--ink)}
.tier-h span{font-size:.82rem; color:var(--muted)}
.act td{font-size:.86rem}
.act td:first-child{font-family:var(--serif); font-weight:900; color:var(--blue); width:34px}
.act .issue{font-weight:700; color:var(--ink); min-width:180px}
.act .data{color:var(--body); min-width:200px}
.act .owner{white-space:nowrap; font-weight:500; color:var(--navy)}
.act .when{white-space:nowrap}
.act .rx{min-width:240px}
.act .why{display:block; margin-top:4px; font-size:.78rem; color:var(--muted)}

/* roadmap */
.road{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--rule)}
.phase{padding:18px 18px 18px 0; border-right:1px solid var(--rule-soft)}
.phase + .phase{padding-left:18px}
.phase:last-child{border-right:none}
.phase .when{font-size:.74rem; font-weight:700; letter-spacing:.1em; color:var(--blue)}
.phase h4{font-family:var(--serif); font-size:1.02rem; color:var(--ink); margin:4px 0 10px}
.phase ul{list-style:none; font-size:.84rem}
.phase li{padding:6px 0 6px 16px; border-bottom:1px solid var(--rule-soft); position:relative}
.phase li::before{content:""; position:absolute; left:0; top:13px; width:7px; height:7px; background:var(--navy)}
.phase li small{display:block; color:var(--muted); font-size:.76rem}
@media(max-width:960px){.road{grid-template-columns:1fr 1fr}.phase{padding:18px!important;border-bottom:1px solid var(--rule-soft)}}
@media(max-width:560px){.road{grid-template-columns:1fr}.phase{border-right:none}}

/* targets */
.tgt td.now{font-weight:700; color:var(--ink); white-space:nowrap}
.tgt td.goal{font-weight:700; color:var(--blue); white-space:nowrap}
.tgt td.best{color:var(--muted); white-space:nowrap}

/* closed */
.closed{display:grid; grid-template-columns:repeat(3,1fr); gap:0; border-top:1px solid var(--rule)}
.closed > div{padding:16px 18px 16px 0; border-bottom:1px solid var(--rule-soft)}
.closed h4{font-size:.95rem; color:var(--ink); margin:6px 0 4px}
.closed p{font-size:.84rem; color:var(--muted)}
@media(max-width:860px){.closed{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.closed{grid-template-columns:1fr}}

/* Q&A */
.qa details{border-bottom:1px solid var(--rule)}
.qa summary{cursor:pointer; list-style:none; padding:18px 36px 18px 0; position:relative; font-family:var(--serif); font-weight:700; color:var(--ink); font-size:1.02rem}
.qa summary::-webkit-details-marker{display:none}
.qa summary::after{content:"+"; position:absolute; right:4px; top:14px; font-size:1.4rem; color:var(--blue); font-family:var(--sans)}
.qa details[open] summary::after{content:"−"}
.qa .ans{padding:0 0 20px; font-size:.92rem; max-width:56em}
.qa .ans p + p{margin-top:8px}
.qa .who{font-size:.74rem; font-weight:700; letter-spacing:.08em; color:var(--blue); margin-bottom:6px}

/* appendix */
.notes{font-size:.86rem; list-style:none}
.notes li{padding:10px 0; border-bottom:1px solid var(--rule-soft)}
.notes b{color:var(--ink)}
.data td,.data th{white-space:nowrap; font-size:.82rem; padding:7px 10px}
.data td{text-align:right; font-variant-numeric:tabular-nums}
.data td.l{text-align:left; white-space:normal; color:var(--muted); min-width:160px}
.data tr.grp th{background:var(--tint); font-size:.74rem; letter-spacing:.1em; color:var(--blue); padding-top:12px}
.data td.flag{color:var(--bad); font-weight:700}
.data thead th{text-align:right} .data thead th:first-child,.data thead th:last-child{text-align:left}
.pdfs{display:grid; grid-template-columns:repeat(6,1fr); border-top:1px solid var(--rule)}
.pdf{padding:16px 14px 16px 0; text-decoration:none; color:var(--ink); border-bottom:1px solid var(--rule-soft)}
.pdf .y{font-family:var(--serif); font-size:1.4rem; font-weight:900}
.pdf .i{font-size:.8rem; color:var(--muted)}
.pdf .go{font-size:.78rem; font-weight:700; color:var(--blue); margin-top:6px; display:block}
.pdf:hover .go{text-decoration:underline}
@media(max-width:860px){.pdfs{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.pdfs{grid-template-columns:1fr 1fr}}

.disclaimer{background:var(--tint); padding:20px 24px; font-size:.84rem; color:var(--muted); margin-top:36px}
.disclaimer b{color:var(--ink)}
footer{background:var(--navy); color:#9FB3C2; font-size:.8rem; padding:28px 0}
footer .wrap{display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap}

@media print{
  .nav{display:none}
  section.sec{page-break-inside:auto; padding:32px 0}
  .exhibit,.pillar,.node,tr{page-break-inside:avoid}
  .cover{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .st,.dot,.node.root,.yr:last-child,.matrix .q1,footer{-webkit-print-color-adjust:exact; print-color-adjust:exact}
  .qa details{display:block} .qa details .ans{display:block}
}

/* ---------- login & app shell ---------- */
[hidden]{display:none!important}
.login{min-height:100vh; display:grid; grid-template-columns:1.1fr 1fr; background:#fff}
.login .side{background:var(--navy); color:#fff; padding:64px 56px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden}
.login .side::after{content:""; position:absolute; right:-160px; bottom:-160px; width:420px; height:420px; border:1px solid rgba(255,255,255,.08); border-radius:50%}
.login .side .kicker{font-size:.76rem; letter-spacing:.18em; color:#9FB3C2; font-weight:700}
.login .side h1{font-family:var(--serif); font-weight:900; font-size:clamp(1.8rem,3.4vw,2.6rem); line-height:1.3; margin-top:16px}
.login .side p{color:#C9D5DE; font-size:.92rem; max-width:28em; margin-top:16px}
.login .side small{color:#8EA3B3; font-size:.76rem}
.login form{align-self:center; justify-self:center; width:100%; max-width:380px; padding:48px 24px}
.login form h2{font-family:var(--serif); color:var(--ink); font-size:1.5rem; margin-bottom:6px}
.login form .hint{font-size:.86rem; color:var(--muted); margin-bottom:28px}
.login label{display:block; font-size:.76rem; font-weight:700; letter-spacing:.08em; color:var(--muted); margin-bottom:6px}
.login input{width:100%; font:inherit; font-size:1rem; padding:11px 12px; border:1px solid var(--rule); border-bottom:2px solid var(--navy); margin-bottom:20px; background:#fff; color:var(--ink); border-radius:0}
.login input:focus{outline:2px solid var(--blue); outline-offset:1px}
.btn{font:inherit; font-weight:700; font-size:.92rem; background:var(--navy); color:#fff; border:none; padding:12px 18px; cursor:pointer; width:100%}
.btn:hover{background:var(--navy-2)}
.btn:disabled{opacity:.6; cursor:wait}
.login .err{color:var(--bad); font-size:.86rem; min-height:1.4em; margin-top:12px}
@media(max-width:820px){.login{grid-template-columns:1fr}.login .side{padding:40px 16px}.login form{padding:32px 16px}}
.loading{min-height:60vh; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:.92rem}
.nav .logout{font-size:.78rem; color:var(--muted); background:none; border:none; cursor:pointer; white-space:nowrap; font-family:inherit; text-decoration:underline}
.pdf{cursor:pointer; background:none; border:none; border-bottom:1px solid var(--rule-soft); text-align:left; font:inherit}
.pdf .src{font-size:.7rem; color:var(--muted); display:block; margin-top:2px}
.upload{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:16px; font-size:.84rem; color:var(--muted)}
.upload select,.upload input[type=file]{font:inherit; font-size:.84rem}
.upload .btn{width:auto; padding:7px 14px; font-size:.82rem}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<main class="login" id="login" hidden>
  <div class="side">
    <div>
      <div class="kicker">EXECUTIVE HEALTH BRIEFING</div>
      <h1>大衛健康簡報<br>2021–2026</h1>
      <p>本頁內容為個人健康資料，僅限授權帳號登入後檢視。資料存放於 Supabase，並以資料列層級權限（RLS）限制存取。</p>
    </div>
    <small>個人健康管理醫療團隊</small>
  </div>
  <form id="loginForm" autocomplete="on">
    <h2>登入</h2>
    <p class="hint">請輸入帳號與密碼以檢視簡報。</p>
    <label for="username">帳號</label>
    <input id="username" name="username" autocomplete="username" required>
    <label for="password">密碼</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">登入</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</main>

<!-- ============ APP ============ -->
<nav class="nav" aria-label="章節導覽" id="nav" hidden>
  <div class="wrap">
    <a class="brand" href="#top">大衛健康簡報<span> ·</span> 2021–26</a>
    <ul id="navlist"></ul>
    <button class="print" onclick="window.print()">列印 / 存 PDF</button>
    <button class="logout" id="logoutBtn">登出</button>
  </div>
</nav>
<div id="app" hidden><div class="loading" id="loading">正在從資料庫載入簡報…</div></div>
<footer id="foot" hidden>
  <div class="wrap">
    <span>大衛健康簡報 2021–2026 · 個人健康管理醫療團隊</span>
    <span>資料來源：Supabase 健康資料庫</span>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
var SUPABASE_URL = 'https://cowljafosekwvxithwjd.supabase.co';
var SUPABASE_KEY = 'sb_publishable_YP57cbbDJSP7-PvBgtKivA_25uDcp5n';
var LOGIN_DOMAIN = 'david-health.app';   // 帳號 davidyeh → davidyeh@david-health.app
var BUCKET = 'health-reports';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

var YEARS = ['2021','2022','2023','2024','2025','2026'];
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function showLogin(msg){
  $('login').hidden = false; $('nav').hidden = true; $('app').hidden = true; $('foot').hidden = true;
  $('loginErr').textContent = msg || '';
}

$('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  var u = $('username').value.trim(), p = $('password').value;
  var email = u.indexOf('@') === -1 ? u + '@' + LOGIN_DOMAIN : u;
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  var res = await sb.auth.signInWithPassword({email: email, password: p});
  $('loginBtn').disabled = false;
  if(res.error){ $('loginErr').textContent = '帳號或密碼錯誤'; return; }
  $('password').value = '';
  loadApp();
});

$('logoutBtn').addEventListener('click', async function(){
  await sb.auth.signOut();
  $('app').innerHTML = '<div class="loading" id="loading">正在從資料庫載入簡報…</div>';
  $('navlist').innerHTML = '';
  showLogin();
});

async function loadApp(){
  $('login').hidden = true; $('app').hidden = false;
  var q = await Promise.all([
    sb.from('health_report_sections').select('id,sort,nav_label,html').order('sort'),
    sb.from('health_scorecard').select('*').order('sort'),
    sb.from('health_metric_defs').select('*').order('sort'),
    sb.from('health_metrics').select('metric_key,year,value,value_text,flagged'),
    sb.from('health_followups').select('*').order('no'),
    sb.from('health_checkups').select('*').order('year')
  ]);
  var err = q.find(function(r){ return r.error; });
  if(err){ await sb.auth.signOut(); showLogin('無法載入資料：' + err.error.message); return; }
  if(!q[0].data.length){ await sb.auth.signOut(); showLogin('此帳號沒有檢視權限'); return; }

  var app = $('app');
  app.innerHTML = q[0].data.map(function(s){ return s.html; }).join('\n');
  $('navlist').innerHTML = q[0].data.filter(function(s){ return s.nav_label; })
    .map(function(s){ return '<li><a href="#'+s.id+'">'+esc(s.nav_label)+'</a></li>'; }).join('');
  $('nav').hidden = false; $('foot').hidden = false;

  var byKey = {};
  q[3].data.forEach(function(m){ (byKey[m.metric_key] = byKey[m.metric_key] || {})[m.year] = m; });

  renderScorecard(q[1].data);
  renderCharts(q[2].data, byKey);
  renderFollowups(q[4].data);
  renderDataTable(q[2].data, byKey);
  renderReports(q[5].data);
  initScrollspy();
  if(location.hash){ var t = document.querySelector(location.hash); if(t) t.scrollIntoView(); }
}

/* ---------- Exhibit 3: scorecard ---------- */
var LBL = {good:'正常', warn:'注意', bad:'異常', na:'—'};
function renderScorecard(rows){
  document.querySelector('#heat tbody').innerHTML = rows.map(function(r){
    return '<tr><th>'+esc(r.system)+'</th>' +
      r.statuses.map(function(s){ return '<td><span class="st '+s+'">'+LBL[s]+'</span></td>'; }).join('') +
      '<td class="trend">'+esc(r.comment)+'</td></tr>';
  }).join('');
}

/* ---------- Exhibit 8 + follow-up tables ---------- */
var TIERS = {
  1:{chip:'<span class="st bad">第一級</span>', h:'一個月內處理', sub:'最優先啟動'},
  2:{chip:'<span class="st warn">第二級</span>', h:'三個月內處理', sub:'需要醫療決策或門診確認'},
  3:{chip:'<span class="st na">第三級</span>', h:'持續管理', sub:'納入年度追蹤清單'}
};
function renderFollowups(items){
  var m = $('matrix'), lis = '';
  items.forEach(function(it){
    var d = document.createElement('div');
    d.className = 'dot t'+it.tier;
    d.style.left = it.urgency+'%'; d.style.bottom = it.impact+'%';
    d.textContent = it.no;
    d.setAttribute('data-tip', it.no+'. '+it.short_label);
    d.setAttribute('aria-label', it.no+'. '+it.short_label);
    m.appendChild(d);
    lis += '<li><span class="n">'+it.no+'</span><span>'+esc(it.short_label)+'</span>'+TIERS[it.tier].chip+'</li>';
  });
  $('mlist').innerHTML = lis;

  // title/data/action columns are authored HTML stored in the database
  $('followup-tables').innerHTML = [1,2,3].map(function(t){
    var rows = items.filter(function(it){ return it.tier === t; }).map(function(it){
      return '<tr><td>'+it.no+'</td><td class="issue">'+it.title+'</td><td class="data">'+it.data+'</td>' +
        '<td class="owner">'+it.owner+'</td><td class="rx">'+it.action+(it.why ? '<span class="why">'+it.why+'</span>' : '')+'</td>' +
        '<td class="when">'+it.timing+'</td></tr>';
    }).join('');
    return '<div class="tier"><div class="tier-h">'+TIERS[t].chip+'<h3>'+TIERS[t].h+'</h3><span>'+TIERS[t].sub+'</span></div>' +
      '<div class="tbl-wrap"><table class="act"><thead><tr><th>#</th><th>事項</th><th>現況數據</th><th>負責專科</th><th>建議行動</th><th>時程</th></tr></thead>' +
      '<tbody>'+rows+'</tbody></table></div></div>';
  }).join('');
}

/* ---------- Exhibit A2: data table ---------- */
function renderDataTable(defs, byKey){
  var h = '', cat = null;
  defs.forEach(function(d){
    if(d.category !== cat){ cat = d.category; h += '<tr class="grp"><th colspan="8">'+esc(cat)+'</th></tr>'; }
    h += '<tr><th>'+esc(d.label)+(d.unit ? ' ('+esc(d.unit)+')' : '')+'</th>';
    YEARS.forEach(function(y){
      var m = (byKey[d.metric_key] || {})[y];
      h += m ? '<td'+(m.flagged ? ' class="flag"' : '')+'>'+esc(m.value_text)+'</td>' : '<td>—</td>';
    });
    h += '<td class="l">'+esc(d.ref_text || '')+'</td></tr>';
  });
  document.querySelector('#datatable tbody').innerHTML = h;
}

/* ---------- Exhibit A4: original reports (private bucket, Drive fallback) ---------- */
async function renderReports(checkups){
  var list = await sb.storage.from(BUCKET).list('', {limit:100});
  var stored = {};
  (list.data || []).forEach(function(o){ stored[o.name] = true; });
  $('pdfs').innerHTML = checkups.map(function(c){
    var inStore = c.storage_path && stored[c.storage_path];
    return '<button class="pdf" type="button" data-year="'+c.year+'" data-path="'+(inStore ? esc(c.storage_path) : '')+'" data-drive="'+esc(c.drive_url || '')+'">' +
      '<div class="y">'+c.year+'</div><div class="i">'+esc(c.institution)+'</div>' +
      '<span class="go">開啟 PDF →</span><span class="src">'+(inStore ? 'Supabase 私有儲存' : 'Google Drive（需登入 Google）')+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('#pdfs .pdf'), function(b){
    b.addEventListener('click', async function(){
      if(b.dataset.path){
        var w = window.open('', '_blank');
        var r = await sb.storage.from(BUCKET).createSignedUrl(b.dataset.path, 300);
        if(r.error){ if(w) w.close(); alert('無法開啟：' + r.error.message); return; }
        if(w) w.location = r.data.signedUrl; else location.href = r.data.signedUrl;
      } else if(b.dataset.drive){
        window.open(b.dataset.drive, '_blank', 'noopener');
      }
    });
  });
  $('upload').innerHTML = '<span>上傳報告至 Supabase 私有儲存：</span>' +
    '<select id="upYear">'+checkups.map(function(c){ return '<option value="'+c.year+'">'+c.year+'</option>'; }).join('')+'</select>' +
    '<input type="file" id="upFile" accept="application/pdf">' +
    '<button class="btn" type="button" id="upBtn">上傳</button><span id="upMsg"></span>';
  $('upBtn').addEventListener('click', async function(){
    var f = $('upFile').files[0];
    if(!f){ $('upMsg').textContent = '請先選擇 PDF'; return; }
    $('upBtn').disabled = true; $('upMsg').textContent = '上傳中…';
    var r = await sb.storage.from(BUCKET).upload($('upYear').value + '.pdf', f, {upsert:true, contentType:'application/pdf'});
    $('upBtn').disabled = false;
    $('upMsg').textContent = r.error ? '上傳失敗：' + r.error.message : '已上傳';
    if(!r.error) renderReports(checkups);
  });
}

/* ---------- Exhibit 7: trend small multiples ---------- */
var BLUE='#2251FF', NAVY='#051C2C', GRID='#E8ECEF', MUTED='#5E6E7A', REF='#8A979F';
var INST_BREAKS = [[1.5,'榮總'],[4.5,'晶英']];

var overlayPlugin = {
  id:'overlay',
  afterDraw:function(chart){
    var o = chart.options.plugins.overlay; if(!o) return;
    var ctx = chart.ctx, x = chart.scales.x, y = chart.scales.y, a = chart.chartArea;
    ctx.save();
    // institution breaks
    ctx.strokeStyle = '#C3CCD3'; ctx.lineWidth = 1; ctx.setLineDash([]);
    ctx.font = '500 10px "Noto Sans TC",sans-serif'; ctx.fillStyle = REF; ctx.textAlign = 'left';
    INST_BREAKS.forEach(function(b){
      var px = x.getPixelForValue(b[0]);
      ctx.beginPath(); ctx.moveTo(px, a.top - 14); ctx.lineTo(px, a.bottom); ctx.stroke();
      ctx.fillText(b[1], px + 4, a.top - 5);
    });
    ctx.fillText('佑康', a.left + 2, a.top - 5);
    // reference line
    var py = y.getPixelForValue(o.ref);
    if(py >= a.top && py <= a.bottom){
      ctx.strokeStyle = REF; ctx.setLineDash([4,4]); ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(a.left, py); ctx.lineTo(a.right, py); ctx.stroke();
      ctx.setLineDash([]);
    }
    // direct labels: first and last available values
    var meta = chart.getDatasetMeta(0), data = chart.data.datasets[0].data;
    var first = data.findIndex(function(v){return v!==null;}), last = data.length - 1;
    [first, last].forEach(function(i, k){
      if(data[i]===null) return;
      var pt = meta.data[i];
      ctx.font = (k ? '700 12px' : '500 11px') + ' "Noto Sans TC",sans-serif';
      ctx.fillStyle = k ? NAVY : MUTED;
      ctx.textAlign = k ? 'right' : 'left';
      var txt = o.dec ? data[i].toFixed(o.dec) : String(data[i]);
      var ty = pt.y - 10 < a.top + 4 ? pt.y + 18 : pt.y - 10;
      ctx.fillText(txt, pt.x + (k ? -2 : 2), ty);
    });
    ctx.restore();
  }
};

function renderCharts(defs, byKey){
  var host = $('charts');
  var charts = defs.filter(function(d){ return d.chart; })
    .sort(function(a,b){ return a.chart.order - b.chart.order; });
  charts.forEach(function(def){
    var c = def.chart;
    var d = YEARS.map(function(y){ var m = (byKey[def.metric_key] || {})[y]; return m && m.value !== null ? Number(m.value) : null; });
    var card = document.createElement('div');
    card.className = 'chart-card';
    card.innerHTML = '<div class="ct">'+esc(c.title)+'</div><div class="cs">單位：'+esc(def.unit || '')+'<span class="rk">虛線：'+esc(c.refL)+'</span></div>'+
      '<div class="box"><canvas role="img" aria-label="'+esc(c.title)+' 2021 至 2026 趨勢"></canvas></div>'+
      '<div class="so">'+c.so+'</div>';
    host.appendChild(card);
    var last = d.length - 1;
    new Chart(card.querySelector('canvas'), {
      type:'line',
      data:{labels:YEARS, datasets:[{
        data:d, borderColor:BLUE, borderWidth:2, spanGaps:true, tension:0,
        segment:{borderDash:function(ctx){ return (d[ctx.p0DataIndex]===null || d[ctx.p1DataIndex]===null || ctx.p1DataIndex-ctx.p0DataIndex>1) ? [3,3] : undefined; }},
        pointRadius:d.map(function(v,i){return i===last?6:4;}),
        pointHoverRadius:7,
        pointBackgroundColor:d.map(function(v,i){return i===last?NAVY:'#fff';}),
        pointBorderColor:d.map(function(v,i){return i===last?'#fff':BLUE;}),
        pointBorderWidth:2, pointHitRadius:14
      }]},
      options:{
        responsive:true, maintainAspectRatio:false, animation:false,
        layout:{padding:{top:18,right:8,left:0}},
        interaction:{mode:'index', intersect:false},
        scales:{
          x:{grid:{display:false}, border:{color:'#9AA7B0'}, ticks:{color:MUTED, font:{size:11}}},
          y:{min:c.min, max:c.max, grid:{color:GRID}, border:{display:false}, ticks:{color:MUTED, font:{size:10}, maxTicksLimit:5}}
        },
        plugins:{
          legend:{display:false},
          tooltip:{backgroundColor:NAVY, titleFont:{size:12}, bodyFont:{size:12}, displayColors:false, padding:8,
            callbacks:{label:function(t){ return t.raw===null ? '未檢查' : t.raw + ' ' + (def.unit || ''); }}},
          overlay:{ref:c.ref, refL:c.refL, dec:c.dec}
        }
      },
      plugins:[overlayPlugin]
    });
  });
}

/* ---------- scrollspy ---------- */
function initScrollspy(){
  var links = Array.prototype.slice.call(document.querySelectorAll('#navlist a'));
  var map = {}; links.forEach(function(a){ map[a.getAttribute('href').slice(1)] = a; });
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){
        links.forEach(function(a){a.classList.remove('active');});
        var a = map[e.target.id]; if(a){ a.classList.add('active'); var ul=a.closest('ul'); ul.scrollLeft = a.parentNode.offsetLeft - ul.clientWidth/2 + a.offsetWidth/2; }
      }
    });
  }, {rootMargin:'-45% 0px -50% 0px'});
  Object.keys(map).forEach(function(id){ var s=document.getElementById(id); if(s) obs.observe(s); });
}

/* ---------- boot ---------- */
sb.auth.getSession().then(function(r){
  if(r.data && r.data.session) loadApp(); else showLogin();
});
</script>
